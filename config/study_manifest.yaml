  - { name: v2-e6-haiku-canonical-rep2-60, config_hash: f6c0edce210b, prompt_hash: c61ad0a7b7f8, config: config/experiments/e6_llm_haiku.yaml, prompt_track: canonical, mode: routing-only, reps: 2, cases: { limit: 60 }, priority: 41, purpose: "flip rate (rep 1 = cache hit of the r1 run)" }

  # ---- 6. Qwen3-8B local: 1 rep + rep 2 on 50 stratified cases (determinism, M7);
  #         tuned == canonical (P0); concurrency 1, one resident Ollama model
  - { name: v2-e6b-qwen-canonical-routing-r1, config_hash: 903a4a1e56d3, prompt_hash: c61ad0a7b7f8, config: config/experiments/e6b_llm_qwen3_local.yaml, prompt_track: canonical, mode: routing-only, reps: 1, priority: 50, concurrency: 1, purpose: "S2 Qwen vs Sonnet" }
  - { name: v2-e6b-qwen-canonical-repeat50, config_hash: 903a4a1e56d3, prompt_hash: c61ad0a7b7f8, config: config/experiments/e6b_llm_qwen3_local.yaml, prompt_track: canonical, mode: routing-only, reps: 2, cases: { limit: 50 }, priority: 51, concurrency: 1, purpose: "determinism: 0 flips expected (rep 1 = cache hit of the r1 run)" }

