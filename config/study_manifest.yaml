  # confirmatory (Holm across H1-H3); the E5 reference is the canonical run (= tuned prompt)
  - { run: v2-e9-tuned-routing-r3, reference: v2-e5-sonnet-canonical-routing-r3, family: H, kind: non_inferiority, margin: 0.03 }
  - { run: v2-e7-tuned-routing-r3, reference: v2-e5-sonnet-canonical-routing-r3, family: H, kind: non_inferiority, margin: 0.03 }
  - { run: v2-e9-tuned-e2e-r1, reference: v2-e0-native-e2e-r1, family: H, kind: two_sided }
  # S2: model vs model on the canonical track, TOST equivalence at +-3 pp
  - { run: v2-e6-haiku-canonical-routing-r1, reference: v2-e5-sonnet-canonical-routing-r3, family: S2, kind: equivalence, margin: 0.03 }
  - { run: v2-e6b-qwen-canonical-routing-r1, reference: v2-e5-sonnet-canonical-routing-r3, family: S2, kind: equivalence, margin: 0.03 }
  - { run: v2-e4-jev-canonical-routing-r3, reference: v2-e5-sonnet-canonical-routing-r3, family: S2, kind: equivalence, margin: 0.03 }
  # S4: lexical vs semantic
  - { run: v2-e3-embedding-routing-r1, reference: v2-e1-regex-routing-r1, family: S4, kind: two_sided }
