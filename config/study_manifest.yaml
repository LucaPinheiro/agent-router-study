# Final study run manifest: FROZEN at pre-registration (git tag prereg-v1, docs/prereg/prereg-v1.md).
#   uv run study run-manifest config/study_manifest.yaml --dry-run   # status + projected cost
#   uv run study run-manifest config/study_manifest.yaml             # priority order
#   uv run study report --manifest config/study_manifest.yaml --split test_v2
# Run with BUDGET__AWS_USD_CAP=85 (90 minus the 5 US$ margin) and the OpenRouter cap at the
# ledger total at launch + 4.0 (prereg-v1, "Budget").
#
# Rules (src/routing_study/eval/manifest.py; methodology-final.md B6, PRE-REGISTRATION):
# - Version guard. Each run's LLM/Jev routers must be on its `prompt_track`. The frozen
#   `config_hash` / `prompt_hash` below must be reproduced. Existing rows must carry the same
#   hashes.
# - Budget. The measured cost per turn times the missing turns is checked against the ledger
#   caps before each run. The a-priori (no-cache) upper bound is used when nothing was measured.
#   A run the guard refuses is reported as not run (deviation log), never squeezed in.
# - Resume. Missing (case, rep) keys are appended to results/<name>.jsonl. A paid partial is
#   never deleted.
# - Complete: every key present and error rate <= error_budget. Otherwise the error rows are
#   retried (kept in <name>.retryK.errors.jsonl), up to max_infra_retries times. A run still
#   above budget is FLAGGED: fix the infrastructure and redo it from scratch. It is never
#   re-run for any other reason.
#
# Prompt tracks (docs/prompt-apex.md, config/prompt_selection.yaml): canonical = tuned = P0 for
# Sonnet 5, Haiku 4.5 and Jev, so track B == track A for them: no *_tuned copy and no duplicate
# run; the "tuned" reference of H1/H2 is the canonical Sonnet run (same prompt bytes). The
# cascades (E7-E9) are labelled tuned (their blocks carry prompt_track: tuned, variant P0).
#
# Response cache (M8): Sonnet, Haiku, Qwen and Jev decisions are cached per (case, rep, rendered
# prompt). The shadow pass runs first, so the Sonnet / Jev steps of E4, E5 and E7-E9 are cache
# hits of the SAME samples (paired by construction; reps stay independent samples). Their
# latency is therefore the shadow pass's: latency comes from the dedicated benchmark only.
#
# Repeat checks (M7): `reps: 2` on a fixed stratified subset; rep 1 is a cache hit of the main
# run (same case, rep 1), rep 2 is a fresh sample, so the flip rate is rep 1 vs rep 2.
# Executor variance (M6): `reps: 1` on 60 cases in a second run name: the routers are cache hits
# of the main e2e run's rep 1, the executor (never cached) samples again.
version: 1
split: test_v2
results_dir: results
error_budget: 0.02
max_infra_retries: 2

runs:
  # ---- 1. free routers at full scale: infrastructure smoke test (and part of the design, B3)
  - { name: v2-e1-regex-routing-r1, config_hash: 2da827d0effb, prompt_hash: c61ad0a7b7f8, config: config/experiments/e1_regex.yaml, mode: routing-only, reps: 1, priority: 10, purpose: "RQ1 regex, S3, S4 reference" }
  - { name: v2-e2-bm25-routing-r1, config_hash: 7bb5a5960490, prompt_hash: c61ad0a7b7f8, config: config/experiments/e2_bm25.yaml, mode: routing-only, reps: 1, priority: 10, purpose: "RQ1 BM25, S3" }
  - { name: v2-e3-embedding-routing-r1, config_hash: 1899b6f414a5, prompt_hash: c61ad0a7b7f8, config: config/experiments/e3_embedding.yaml, mode: routing-only, reps: 1, priority: 10, purpose: "RQ1 embedding, S4" }
  - { name: v2-e10-classifier-routing-r1, config_hash: 616af886b783, prompt_hash: c61ad0a7b7f8, config: config/experiments/e10_classifier.yaml, mode: routing-only, reps: 1, priority: 10, purpose: "estimation: learned classifier (open Jev replica)" }
  - { name: v2-e11-hybrid-routing-r1, config_hash: 68cc177d37b0, prompt_hash: c61ad0a7b7f8, config: config/experiments/e11_hybrid.yaml, mode: routing-only, reps: 1, priority: 10, purpose: "estimation: hybrid regex + classifier" }
  - name: v2-e1-regex-routing-repeat20
    config_hash: 2da827d0effb
    prompt_hash: c61ad0a7b7f8
    config: config/experiments/e1_regex.yaml
    mode: routing-only
    reps: 2
    cases: { limit: 20 }
    priority: 11
    purpose: "determinism check (0 flips expected)"
  - { name: v2-e3-embedding-qwen06b-routing-r1, config_hash: 98ef77240be7, prompt_hash: c61ad0a7b7f8, config: config/experiments/e3_embedding_qwen06b.yaml, mode: routing-only, reps: 1, priority: 15, purpose: "estimation: embedder ablation (qwen3-embedding 0.6B)" }
  - { name: v2-e3-embedding-bgem3-routing-r1, config_hash: 3b95fe4e6beb, prompt_hash: c61ad0a7b7f8, config: config/experiments/e3_embedding_bgem3.yaml, mode: routing-only, reps: 1, priority: 15, purpose: "estimation: embedder ablation (bge-m3)" }

  # ---- 2. shadow pass (E9 decider, tuned track = P0), 3 reps: pays the Sonnet 5 and Jev
  #         samples that the E4 / E5 / E7-E9 runs below reuse; cascade replay only, never an
  #         isolated-strategy headline (B3). Qwen3-8B is left out of the shadow set (not a step of
  #         any cascade; one resident Ollama model).
  - name: v2-shadow-tuned-routing-r3
    config_hash: cc01e0b06bb2
    prompt_hash: c61ad0a7b7f8
    config: config/experiments/e9_regex_jev_llm.yaml
    prompt_track: tuned
    mode: routing-only
    routing_mode: shadow
    reps: 3
    priority: 20
    purpose: "cascade replay / threshold sensitivity (never an isolated-strategy headline, B3)"
    overrides:
      routing.shadow_strategies: [regex, bm25, embedding, llm, jev, hybrid, classifier]

  # ---- 3. LLM / Jev singles, canonical track (= tuned for Sonnet 5 and Jev), 3 reps
  - { name: v2-e4-jev-canonical-routing-r3, config_hash: acd7ff96155b, prompt_hash: c61ad0a7b7f8, config: config/experiments/e4_jev.yaml, prompt_track: canonical, mode: routing-only, reps: 3, priority: 25, purpose: "S2 Jev vs Sonnet; tuned == canonical" }
  - { name: v2-e5-sonnet-canonical-routing-r3, config_hash: 40c93f91f270, prompt_hash: c61ad0a7b7f8, config: config/experiments/e5_llm_sonnet.yaml, prompt_track: canonical, mode: routing-only, reps: 3, priority: 25, purpose: "H1/H2 reference (tuned == canonical), S2 reference" }

  # ---- 4. cascades on the tuned track, thresholds frozen from the dev shadow (D5), 3 reps
  - { name: v2-e7-tuned-routing-r3, config_hash: 4fbfd7133b32, prompt_hash: c61ad0a7b7f8, config: config/experiments/e7_regex_jev.yaml, prompt_track: tuned, mode: routing-only, reps: 3, priority: 30, purpose: "H2" }
  - { name: v2-e9-tuned-routing-r3, config_hash: 8f5f721c9158, prompt_hash: c61ad0a7b7f8, config: config/experiments/e9_regex_jev_llm.yaml, prompt_track: tuned, mode: routing-only, reps: 3, priority: 30, purpose: "H1" }
