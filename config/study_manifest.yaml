# Pre-registered contrasts (docs/prereg/prereg-v1.md). Holm runs within each family. Headline:
# joint (routing-only), e2e_success (e2e). S1 has no test-v2 contrast: tuned == canonical for
# every LLM-type router (Δ = 0 by construction). S3 compares with the dev CV numbers (not a run
# contrast).
