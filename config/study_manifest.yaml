  - { name: lat-regex-b1, config_hash: 91d9efe3e475, prompt_hash: c61ad0a7b7f8, config: config/experiments/e1_regex.yaml, mode: routing-only, cases: { ids_file: config/manifest/latency_test_v2_b1.ids }, concurrency: 1, priority: 70, overrides: &lat { cache_dir: .cache/latency, strategies.llm.cache: false, strategies.llm_local.cache: false, strategies.jev.cache: false, strategies.embedding.cache: false }, purpose: "latency benchmark block 1" }
