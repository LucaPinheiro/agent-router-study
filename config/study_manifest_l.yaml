# Part B run manifest (large catalog, 62 tools, split test-L): prereg-v2 (docs/prereg/prereg-v2.md).
# Frozen at the git tag `prereg-v2`, before the first test-L row.
#   uv run study run-manifest config/study_manifest_l.yaml --dry-run   # status + projected cost
#   uv run study run-manifest config/study_manifest_l.yaml             # priority order
#   uv run python scripts/analysis/phase2_b.py --manifest config/study_manifest_l.yaml
# Run with BUDGET__AWS_USD_CAP=92.11 (phase-2 AWS mark 52.11 + 40) and
# BUDGET__OPENROUTER_USD_CAP=9.43 (OpenRouter mark 5.83 + 3.6). Same guard, resume, completion and
# retry rules as config/study_manifest.yaml (src/routing_study/eval/manifest.py): error_budget 2%,
# at most 2 infra retries of the error rows, a run still above budget is FLAGGED, never patched.
#
# Phase-2 constraints (binding, 2026-10-02): no LOCAL model is run (no Ollama; regex and BM25 are
# CPU code, not models, and stay); OpenRouter only for typesafe/jev-router; everything else on
# Bedrock. Sonnet 5 is NEVER a standalone router here: it appears only as the last step of the
# E9-L / E12-L cascades and as the e2e executor. The large-profile embedder is Titan v2
# (amazon.titan-embed-text-v2:0, the Part-A dev winner), so E3-L / E10-L / E11-L are the Titan
# arms; E3c / E3t / E10c are not separate test-L runs (E3t == E3-L; Cohere lost Part-A dev CV).
#
# Every large-profile entry asserts catalog_hash bc7cd75fce87 (mcp-server-large on :8766); the
# X2 entries (small profile, phase-1 / Part-A configs on :8765) assert 128584617807.
#
# Run names are the ones pinned by the frozen analysis (scripts/analysis/phase2_b.py, ROUTING_L,
# E2E_L, VARIANCE_L, REPEATS_L, LAT_L, X2_KEYS). The shadow pass is a cache-filling run the
# analysis does not read (reported as "unmapped").
#
# Priority order = the plan's drop order (autopilot-impl.md §5): the guard refuses, never
# reorders, so the lowest-priority entries are the first ones a cap removes: executor variance
# (B16, 90), then E9-L-fullskill (B15, 85), then X2-Haiku (B18, 81), then latency (B17, 70).
#
# Case-id files written after T4.3 (they read only ids/categories/labels, never message text):
#   uv run python scripts/analysis/latency_ids.py --split test_l     # latency_test_l_b{1..4}.ids
#   uv run python scripts/analysis/x2_orig_ids.py                    # x2_test_l_orig.ids
#
# Response cache (M8): Jev / Haiku / Ministral / Nemotron / Sonnet decisions are cached per (case,
# rep, rendered prompt). The shadow pass runs first, so the Jev samples of E4 and of the E7-L /
# E9-L / E12-L cascades are cache hits of the SAME samples (paired by construction). e2e routers
# are cache hits of the routing runs' rep 1; the executor is never cached.
version: 1
split: test_l
results_dir: results
error_budget: 0.02
max_infra_retries: 2

runs:
  # ---- 10. free routers (regex, BM25: CPU; E3/E10/E11: Bedrock Titan v2 vectors), 1 rep
  - { name: l-e1-regex-routing-r1, config_hash: 9edc10d85a4e, prompt_hash: c61ad0a7b7f8, config: config/experiments_l/e1_regex_l.yaml, catalog_hash: bc7cd75fce87, mode: routing-only, reps: 1, priority: 10, purpose: "S3, S4 reference (E1 regex)" }
  - { name: l-e2-bm25-routing-r1, config_hash: 047a16011d05, prompt_hash: c61ad0a7b7f8, config: config/experiments_l/e2_bm25_l.yaml, catalog_hash: bc7cd75fce87, mode: routing-only, reps: 1, priority: 10, purpose: "estimation (E2 BM25)" }
  - { name: l-e3-embedding-routing-r1, config_hash: 3cd09a609c93, prompt_hash: c61ad0a7b7f8, config: config/experiments_l/e3_embedding_l.yaml, catalog_hash: bc7cd75fce87, mode: routing-only, reps: 1, priority: 10, purpose: "S4 (E3 Titan v2 embedding)" }
  - { name: l-e10-classifier-routing-r1, config_hash: 61260135d35a, prompt_hash: c61ad0a7b7f8, config: config/experiments_l/e10_classifier_l.yaml, catalog_hash: bc7cd75fce87, mode: routing-only, reps: 1, priority: 10, purpose: "S7 (E10 probe on Titan v2 vectors)" }
  - { name: l-e11-hybrid-routing-r1, config_hash: 0078bcc597f8, prompt_hash: c61ad0a7b7f8, config: config/experiments_l/e11_hybrid_l.yaml, catalog_hash: bc7cd75fce87, mode: routing-only, reps: 1, priority: 10, purpose: "estimation (E11 hybrid regex+probe)" }
  - { name: l-e1-regex-routing-repeat20, config_hash: 9edc10d85a4e, prompt_hash: c61ad0a7b7f8, config: config/experiments_l/e1_regex_l.yaml, catalog_hash: bc7cd75fce87, mode: routing-only, reps: 2, cases: { limit: 20 }, priority: 11, purpose: "determinism check (0 flips expected)" }

  # ---- 20. shadow pass (E9-L decider, tuned track = P0), 3 reps, WITHOUT Sonnet as a shadow
  #         strategy: pays the Jev samples that E4 / E7-L / E9-L / E12-L reuse; cascade replay
  #         only, never an isolated-strategy headline.
  - name: l-shadow-tuned-routing-r3
    config_hash: ae7dda1ab390
    prompt_hash: c61ad0a7b7f8
    config: config/experiments_l/e9_regex_jev_llm_l.yaml
    catalog_hash: bc7cd75fce87
    prompt_track: tuned
    mode: routing-only
    routing_mode: shadow
    reps: 3
    priority: 20
    purpose: "cascade replay / threshold sensitivity (cache filler; not analysed as an arm)"
    overrides:
      routing.shadow_strategies: [regex, bm25, embedding, classifier, hybrid, jev]

  # ---- 25. LLM / Jev singles, canonical track (P0)
  - { name: l-e4-jev-canonical-routing-r3, config_hash: d8d2f8940050, prompt_hash: c61ad0a7b7f8, config: config/experiments_l/e4_jev_l.yaml, catalog_hash: bc7cd75fce87, prompt_track: canonical, mode: routing-only, reps: 3, priority: 25, purpose: "H3-L (E4 Jev), S7 reference; shared with the shadow / E7-L / E9-L" }
  - { name: l-e6-haiku-canonical-routing-r1, config_hash: 8b7b8fb00143, prompt_hash: c61ad0a7b7f8, config: config/experiments_l/e6_llm_haiku_l.yaml, catalog_hash: bc7cd75fce87, prompt_track: canonical, mode: routing-only, reps: 1, priority: 25, purpose: "H2-L and H3-L reference (E6 Haiku 4.5)" }
  - { name: l-e6m-ministral-canonical-routing-r1, config_hash: 1ce8c6004c5f, prompt_hash: c61ad0a7b7f8, config: config/experiments_l/e6m_llm_ministral_l.yaml, catalog_hash: bc7cd75fce87, prompt_track: canonical, mode: routing-only, reps: 1, priority: 25, purpose: "H2-L (E6m Ministral 3 8B vs Haiku 4.5, NI 3 pp)" }
  - { name: l-e6n-nemotron-canonical-routing-r1, config_hash: ae768b0a8656, prompt_hash: c61ad0a7b7f8, config: config/experiments_l/e6n_llm_nemotron_l.yaml, catalog_hash: bc7cd75fce87, prompt_track: canonical, mode: routing-only, reps: 1, priority: 25, purpose: "estimation (E6n Nemotron Nano 9B v2)" }

