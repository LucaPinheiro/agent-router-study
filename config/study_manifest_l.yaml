  - { name: l-e9-tuned-routing-r3, config_hash: 8236c879738c, prompt_hash: c61ad0a7b7f8, config: config/experiments_l/e9_regex_jev_llm_l.yaml, catalog_hash: bc7cd75fce87, prompt_track: tuned, mode: routing-only, reps: 3, priority: 30, purpose: "E9-L routing (H1-L router; estimation)" }
