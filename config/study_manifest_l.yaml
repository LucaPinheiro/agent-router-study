  # ---- 40. end-to-end, 1 rep, Sonnet 5 executor (H1-L, symmetric scorer)
  - { name: l-e0-native-e2e-r1, config_hash: 93c7c3ea1e02, prompt_hash: c61ad0a7b7f8, config: config/experiments_l/e0_native_l.yaml, catalog_hash: bc7cd75fce87, mode: e2e, reps: 1, priority: 40, concurrency: 2, purpose: "H1-L reference (E0-L native)" }
