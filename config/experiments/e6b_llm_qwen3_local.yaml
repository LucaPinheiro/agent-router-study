# E6b — local LLM Qwen3-8B (Ollama, q8_0, thinking off): how much a free local LLM loses
routing:
  mode: single
  skill:
    pipeline:
      - { strategy: llm_local }
    on_abstain: escalate
  tool:
    expose_top_k: 2
    pipeline:
      - { strategy: llm_local }

strategies:
  regex:
    rules_path: config/regex_rules.yaml
    history_turns: 2        # tuned by 5-fold CV on dev (scripts/analysis/tune_router.py)
    history_weight: 0.3
    calibration:            # isotonic raw -> P(correct), fitted on dev
      skill: { x: [0.165, 0.290455, 0.516429, 0.926568], y: [0.5, 0.692308, 0.818182, 0.97561] }
      tool:  { x: [0.156, 0.3425, 0.834878], y: [0.571429, 0.681818, 0.925234] }
  bm25:
    # tuned by 5-fold CV on dev (D2, docs/tuning-effort.md): utterance-level index (one doc
    # per catalog utterance, option = sum of its best 4), char 3-5-grams without accent
    # folding, catalog-only expansion (tool examples of a skill + WHEN TO USE quotes).
    # Nested CV joint 40.4 -> 46.4 (one-stage grid) / 51.0 (refinement grid).
    index: utterance
    aggregate: topk_sum
    agg_k: 4
    analyzer: char
    ngram_min: 3
    ngram_max: 5
    fold_accents: false
    shots: true
    quotes: true
    variant: okapi          # utterance corpus: Okapi IDF is no longer degenerate (BM25L not needed)
    k1: 0.6
    b: 0.5
    history_turns: 2
    calibration:            # raw margin -> P(correct), fitted on dev; Platt (skill) / isotonic (tool) by CV Brier
      skill: { x: [0.002006, 0.03753, 0.073053, 0.108576, 0.144099, 0.179623, 0.215146, 0.250669, 0.286192, 0.321715, 0.357239, 0.392762, 0.428285, 0.463808, 0.499332, 0.534855, 0.570378, 0.605901, 0.641425, 0.676948, 0.712471], y: [0.388214, 0.448019, 0.509366, 0.570433, 0.629428, 0.684798, 0.735373, 0.780435, 0.819705, 0.853272, 0.881493, 0.904891, 0.924067, 0.939635, 0.952176, 0.962217, 0.970215, 0.976562, 0.981582, 0.985542, 0.988661] }
      tool:  { x: [0.000842, 0.022289, 0.128491, 0.253802, 0.364955, 0.469964, 0.523546, 0.626912], y: [0.333333, 0.4375, 0.462963, 0.5, 0.594595, 0.631579, 0.666667, 0.928571] }
  embedding:
    provider: ollama
    model: qwen3-embedding:8b-q8_0     # local, 4096-d
    num_ctx: 8192
    # tuned by 5-fold CV on dev (D1, docs/tuning-effort.md): 324-point grid over similarity x
    # top_k x temperature x instruction x history x shots; nested CV joint 77.5 (was 66.2)
    similarity: centroid
    confidence: softmax
    softmax_temperature: 0.02         # chosen by CV Brier after calibration (accuracy-neutral)
    history_turns: 2                  # query = last 2 turns + message
    shots: true                       # + the catalog examples resolved to the option
    # Qwen3-Embedding model card: queries carry the task instruction, documents do not
    query_instruction: "Instruct: Given a customer-service message in Brazilian Portuguese, retrieve the support option that handles it\nQuery:"
    calibration:                      # isotonic raw -> P(correct), fitted on dev (lower CV Brier than Platt)
      skill: { x: [0.361615, 0.518244, 0.60742, 0.832673, 0.94852, 0.96687, 0.988528, 0.997242], y: [0.333333, 0.444444, 0.75, 0.860465, 0.862069, 0.862069, 0.930233, 0.930233] }
      tool:  { x: [0.277759, 0.457729, 0.779592, 0.982974, 0.998994], y: [0.333333, 0.625, 0.710145, 0.860465, 0.973684] }
  llm:       { provider: bedrock, model: global.anthropic.claude-haiku-4-5-20251001-v1:0, temperature: 0, confidence: self_reported }
  llm_local: { provider: ollama, model: "qwen3:8b-q8_0", num_ctx: 8192, temperature: 0, confidence: self_reported }  # thinking off (reasoning.enabled=false)
  jev:       { provider: openrouter, model: typesafe/jev-router, parse_retries: 1 }
  hybrid:    { rrf_k: 60 }

executor:
  provider: bedrock
  model: global.anthropic.claude-sonnet-5   # fills arguments and answers
  temperature: null                         # rejected by Sonnet 5 on Bedrock
  max_tool_iterations: 3
