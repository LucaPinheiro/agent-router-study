# E0 — baseline: no router; the native agent calls load_skill by itself.
routing:
  mode: native
  skill:
    pipeline: []
    on_abstain: escalate
  tool:
    expose_top_k: 2
    pipeline: []

executor:
  provider: bedrock
  model: global.anthropic.claude-sonnet-5   # sees globals + load_skill, then the loaded skill's tools
  temperature: null                         # rejected by Sonnet 5 on Bedrock
  max_tool_iterations: 3
